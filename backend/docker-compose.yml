services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: mysql://buildmart:${MYSQL_PASSWORD:-buildmart}@mysql:3306/buildmart
      MEMCACHED_HOSTS: memcached:11211
      CACHE_TTL: ${CACHE_TTL:-90}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5500,http://127.0.0.1:5500}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@buildmart.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    depends_on:
      mysql:
        condition: service_healthy
      memcached:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: buildmart
      MYSQL_USER: buildmart
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-buildmart}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo version | nc -w 2 127.0.0.1 11211 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
