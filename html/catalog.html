<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/buildmart-toast.css" />
    <link rel="stylesheet" href="../styles/catalog.css" />
    <link rel="stylesheet" href="../styles/footer.css" />
  </head>
  <body>
    <main class="screen">
      <div id="site-header-mount"></div>
      <div class="screen__content">
        <section class="catalog" aria-label="Main Content">
          <div class="catalog__section" aria-label="Section">
            <div class="catalog__container" aria-label="Container">
              <h1 class="catalog__heading">
                <span class="catalog__heading-text">Building Materials</span>
              </h1>
              <p class="catalog__paragraph">
                <span class="catalog__paragraph-text">Premium construction supplies for all your projects</span>
              </p>
            </div>
          </div>
          <div class="catalog__toolbar">
            <div class="catalog__container-secondary" aria-label="Container">
              <div class="catalog__container-horizontal" aria-label="Container">
                <button class="catalog__button" type="button" id="catalog-filters-toggle" aria-expanded="false" aria-controls="catalog-filters-panel">
                  <svg class="catalog__button-icon" width="24" height="24" aria-hidden="true"><use href="../assets/icons/icon-filter.svg"></use></svg>
                  <span class="catalog__button-text">Show Filters</span>
                </button>
                <p class="catalog__inline-paragraph text-gray-600">Showing 6 products</p>
              </div>
            </div>
            <div class="catalog__container-tertiary" aria-label="Sort products">
              <div class="catalog__sort">
                <label class="catalog__sort-label" for="catalog-sort">Sort by:</label>
                <select id="catalog-sort" class="catalog__dropdown" aria-label="Sort products">
                  <option value="name-asc">Name (A-Z)</option>
                  <option value="price-asc">Price (Low to High)</option>
                  <option value="price-desc">Price (High to Low)</option>
                </select>
              </div>
            </div>
          </div>
          <div class="catalog__filters-panel" id="catalog-filters-panel" aria-label="Filters container">
            <div class="catalog__filters-row" aria-label="Container">
              <div class="catalog__filters-column catalog__filters-column--rating" aria-label="Container">
                <h3 class="catalog__filters-heading">
                  <span class="catalog__filters-heading-text">Minimum Rating</span>
                </h3>
                <div class="catalog__filters-track" aria-label="Container">
                  <div class="catalog__rating-options">
                    <div class="catalog__rating-option">
                      <button type="button" role="checkbox" aria-checked="false" data-state="unchecked" class="catalog__rating-checkbox" id="rating-5">
                        <span data-state="unchecked" class="catalog__rating-checkbox-indicator" style="pointer-events: none">
                          <svg class="catalog__rating-checkbox-check" width="24" height="24" aria-hidden="true"><use href="../assets/icons/icon-check.svg"></use></svg>
                        </span>
                      </button>
                      <label class="catalog__rating-label" for="rating-5">5+ Stars</label>
                    </div>
                    <div class="catalog__rating-option">
                      <button type="button" role="checkbox" aria-checked="false" data-state="unchecked" class="catalog__rating-checkbox" id="rating-4">
                        <span data-state="unchecked" class="catalog__rating-checkbox-indicator" style="pointer-events: none">
                          <svg class="catalog__rating-checkbox-check" width="24" height="24" aria-hidden="true"><use href="../assets/icons/icon-check.svg"></use></svg>
                        </span>
                      </button>
                      <label class="catalog__rating-label" for="rating-4">4+ Stars</label>
                    </div>
                    <div class="catalog__rating-option">
                      <button type="button" role="checkbox" aria-checked="false" data-state="unchecked" class="catalog__rating-checkbox" id="rating-3">
                        <span data-state="unchecked" class="catalog__rating-checkbox-indicator" style="pointer-events: none">
                          <svg class="catalog__rating-checkbox-check" width="24" height="24" aria-hidden="true"><use href="../assets/icons/icon-check.svg"></use></svg>
                        </span>
                      </button>
                      <label class="catalog__rating-label" for="rating-3">3+ Stars</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="catalog__filters-column catalog__filters-column--price" aria-label="Price range">
                <h3 class="catalog__filters-heading catalog__filters-heading--price">
                  <span class="catalog__filters-heading-text catalog__filters-heading-text--price">Price Range</span>
                </h3>
                <div class="catalog__price-range">
                  <div class="catalog__price-range-sliders">
                    <div class="catalog__price-range-track" aria-hidden="true">
                      <div class="catalog__price-range-fill" id="catalog-price-range-fill"></div>
                    </div>
                    <input
                      type="range"
                      id="catalog-price-min"
                      class="catalog__price-range-input catalog__price-range-input--min"
                      min="0"
                      max="400"
                      value="0"
                      step="1"
                      aria-label="Minimum price"
                    />
                    <input
                      type="range"
                      id="catalog-price-max"
                      class="catalog__price-range-input catalog__price-range-input--max"
                      min="0"
                      max="400"
                      value="400"
                      step="1"
                      aria-label="Maximum price"
                    />
                  </div>
                  <div class="catalog__price-range-labels">
                    <span class="catalog__price-range-label" id="catalog-price-label-min">$0</span>
                    <span class="catalog__price-range-label" id="catalog-price-label-max">$400</span>
                  </div>
                </div>
              </div>
              <div class="catalog__filters-clear-wrap">
                <button type="button" class="catalog__filters-clear" id="catalog-clear-filters">Clear All Filters</button>
              </div>
            </div>
          </div>
          <div class="catalog__container-quaternary" aria-label="Container">
            <div class="catalog__products-grid" id="catalog-products-grid">
            </div>
            <nav class="catalog__pagination" id="catalog-pagination" aria-label="Catalog pages"></nav>
          </div>
        </section>
      </div>
      <div id="site-footer-mount"></div>
    </main>
    <script src="../scripts/api.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/cart-store.js"></script>
    <script src="../scripts/header.js"></script>
    <script src="../scripts/footer.js"></script>
    <script src="../scripts/buildmart-toast.js"></script>
    <script src="../scripts/catalog-add-to-cart.js"></script>
    <script src="../scripts/catalog.js"></script>
  </body>
</html>
